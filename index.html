<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
  * { touch-action: none; user-select: none; -webkit-user-select: none; }
  body { background:#111; color:#5f5; margin:0; overflow:hidden; font-family:monospace; }
  .top { position:absolute; top:10px; width:100%; text-align:center; z-index:10; }
  .btn { width:60px; height:48px; background:#222; color:#5f5; border:1px solid #444; font-size:13px; margin:2px; display:inline-block; line-height:48px; text-align:center; cursor:pointer; }
  .btn:active, .btn.act { background:#5f5; color:#111; font-weight:bold; }
  #con { width:130px; height:38px; line-height:38px; border-color:#5f5; font-weight:bold; margin-bottom:6px; }
  #wfi { width:110px; height:38px; line-height:38px; border-color:#f55; color:#f55; font-weight:bold; margin-bottom:6px; }
  .base { width:160px; height:160px; background:#1a1a1a; border:2px solid #444; position:absolute; top:60%; margin-top:-80px; cursor:crosshair; }
  #bL { left:4%; }
  #bR { right:4%; }
  .stick { width:40px; height:40px; position:absolute; top:60px; left:60px; pointer-events:none; }
  #sL { background:#5f5; }
  #sR { background:#f55; }
</style>
</head>
<body>

<div class="top">
  <div id="con" class="btn" onclick="connectBLE()">CONNECT BLE</div>
  <div id="wfi" class="btn" onclick="switchToWiFi()">TO WI-FI</div><br>
  <div class="btn cmd" data-c="1">Q</div>
  <div class="btn cmd" data-c="2">E</div>
  <div class="btn cmd" data-c="3">R</div>
  <div class="btn cmd" data-c="4">T</div>
  <div class="btn cmd" data-c="5">Y</div>
</div>

<div id="bL" class="base"><div id="sL" class="stick"></div></div>
<div id="bR" class="base"><div id="sR" class="stick"></div></div>

<script>
const SVC_UUID = '19b10000-e8f2-537e-4f6c-d104768a1214';
const CHR_UUID = '19b10001-e8f2-537e-4f6c-d104768a1214';
let bleDev = null, bleChar = null, busy = false;
let x = 0, y = 0, x1 = 0, y1 = 0, cmd = 0, last = 0;

function onDisconnected() {
  bleChar = null;
  const c = document.getElementById('con');
  c.innerText = 'CONNECT BLE';
  c.style.background = '#222';
  c.style.color = '#5f5';
  resetAll();
}

async function connectBLE() {
  try {
    bleDev = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'RC_CAR' }],
      optionalServices: [SVC_UUID]
    });
    bleDev.addEventListener('gattserverdisconnected', onDisconnected);
    const srv = await bleDev.gatt.connect();
    const svc = await srv.getPrimaryService(SVC_UUID);
    bleChar = await svc.getCharacteristic(CHR_UUID);
    const c = document.getElementById('con');
    c.innerText = 'CONNECTED';
    c.style.background = '#5f5';
    c.style.color = '#111';
  } catch (e) { alert('BLE Err: ' + e); }
}

async function switchToWiFi() {
  if (bleChar) {
    try { await bleChar.writeValueWithoutResponse(new TextEncoder().encode("0,0,0,0,99")); } catch (e) {}
  }
  if (bleDev && bleDev.gatt.connected) bleDev.gatt.disconnect();
  setTimeout(() => { window.location.href = 'http://192.168.4.1'; }, 400);
}

// Оптимальный период 45 мс — не забивает буфер ArduinoBLE и держит плавный ход
async function send(force) {
  const now = Date.now();
  if (!bleChar || (!force && (busy || now - last < 45))) return;
  last = now; busy = true;
  const text = `${x},${y},${x1},${y1},${cmd}`;
  try {
    await bleChar.writeValueWithoutResponse(new TextEncoder().encode(text));
  } catch (e) {}
  busy = false;
}

// Отправка тройного нуля при остановке (чтобы ни один пакет стопа не потерялся)
function sendStop() {
  send(true);
  setTimeout(() => send(true), 50);
  setTimeout(() => send(true), 100);
}

const jL = { id: null, b: document.getElementById('bL'), s: document.getElementById('sL') };
const jR = { id: null, b: document.getElementById('bR'), s: document.getElementById('sR') };

// Жёсткий захват пальца на каждом стике (setPointerCapture) — полностью исключает залипание!
jL.b.addEventListener('pointerdown', e => {
  e.preventDefault();
  jL.id = e.pointerId;
  jL.b.setPointerCapture(e.pointerId);
  moveJoy(e, jL, 1);
});
jL.b.addEventListener('pointermove', e => {
  if (e.pointerId === jL.id) moveJoy(e, jL, 1);
});
function stopL(e) {
  if (e.pointerId === jL.id) {
    jL.id = null; x = 0; y = 0;
    jL.s.style.transform = 'translate(0px,0px)';
    sendStop();
  }
}
jL.b.addEventListener('pointerup', stopL);
jL.b.addEventListener('pointercancel', stopL);
jL.b.addEventListener('lostpointercapture', stopL);

jR.b.addEventListener('pointerdown', e => {
  e.preventDefault();
  jR.id = e.pointerId;
  jR.b.setPointerCapture(e.pointerId);
  moveJoy(e, jR, 2);
});
jR.b.addEventListener('pointermove', e => {
  if (e.pointerId === jR.id) moveJoy(e, jR, 2);
});
function stopR(e) {
  if (e.pointerId === jR.id) {
    jR.id = null; x1 = 0; y1 = 0;
    jR.s.style.transform = 'translate(0px,0px)';
    sendStop();
  }
}
jR.b.addEventListener('pointerup', stopR);
jR.b.addEventListener('pointercancel', stopR);
jR.b.addEventListener('lostpointercapture', stopR);

// Кнопки Q-E-R-T-Y с поддержкой скольжения пальца
let btnPointer = null;
document.querySelector('.top').addEventListener('pointerdown', e => {
  if (e.target.classList.contains('cmd')) {
    btnPointer = e.pointerId;
    e.target.classList.add('act');
    cmd = parseInt(e.target.dataset.c);
    send(true);
  }
});
document.addEventListener('pointermove', e => {
  if (e.pointerId === btnPointer) {
    let el = document.elementFromPoint(e.clientX, e.clientY);
    document.querySelectorAll('.cmd').forEach(b => b.classList.remove('act'));
    if (el && el.classList.contains('cmd')) {
      el.classList.add('act');
      let newCmd = parseInt(el.dataset.c);
      if (newCmd !== cmd) { cmd = newCmd; send(true); }
    } else if (cmd !== 0) { cmd = 0; send(true); }
  }
});
function stopBtn(e) {
  if (e.pointerId === btnPointer) {
    btnPointer = null;
    document.querySelectorAll('.cmd').forEach(b => b.classList.remove('act'));
    if (cmd !== 0) { cmd = 0; sendStop(); }
  }
}
document.addEventListener('pointerup', stopBtn);
document.addEventListener('pointercancel', stopBtn);

function resetAll() {
  jL.id = null; jR.id = null; btnPointer = null;
  x = 0; y = 0; x1 = 0; y1 = 0; cmd = 0;
  jL.s.style.transform = 'translate(0px,0px)';
  jR.s.style.transform = 'translate(0px,0px)';
  document.querySelectorAll('.cmd').forEach(b => b.classList.remove('act'));
}
window.addEventListener('blur', () => { resetAll(); sendStop(); });

function moveJoy(e, j, num) {
  const r = j.b.getBoundingClientRect();
  let dx = Math.max(-60, Math.min(60, e.clientX - (r.left + 80)));
  let dy = Math.max(-60, Math.min(60, e.clientY - (r.top + 80)));
  j.s.style.transform = `translate(${dx}px, ${dy}px)`;
  let valX = Math.round((dx / 60) * 255);
  let valY = Math.round((-dy / 60) * 255);
  if (num === 1) { x = valX; y = valY; }
  else { x1 = valX; y1 = valY; }
  send(false);
}

// Клавиатура ПК
const keys = { KeyW:0, KeyA:0, KeyS:0, KeyD:0, KeyO:0, KeyK:0, KeyL:0, Semicolon:0, ArrowUp:0, ArrowDown:0, ArrowLeft:0, ArrowRight:0 };
const btnCodes = { KeyQ:1, KeyE:2, KeyR:3, KeyT:4, KeyY:5 };

function handleKey(e) {
  if (e.repeat) return;
  const down = (e.type === 'keydown');
  const code = e.code;

  if (code in btnCodes) {
    cmd = down ? btnCodes[code] : 0;
    document.querySelectorAll('.cmd').forEach(b => {
      b.classList.toggle('act', down && parseInt(b.dataset.c) === cmd);
    });
    down ? send(true) : sendStop();
    return;
  }

  if (code in keys) {
    keys[code] = down ? 1 : 0;
    x = (keys.KeyD - keys.KeyA) * 255;
    y = (keys.KeyW - keys.KeyS) * 255;
    x1 = ((keys.Semicolon || keys.ArrowRight) - (keys.KeyK || keys.ArrowLeft)) * 255;
    y1 = ((keys.KeyO || keys.ArrowUp) - (keys.KeyL || keys.ArrowDown)) * 255;

    jL.s.style.transform = `translate(${(x / 255) * 60}px, ${(-y / 255) * 60}px)`;
    jR.s.style.transform = `translate(${(x1 / 255) * 60}px, ${(-y1 / 255) * 60}px)`;
    (x === 0 && y === 0 && x1 === 0 && y1 === 0) ? sendStop() : send(true);
  }
}
window.addEventListener('keydown', handleKey);
window.addEventListener('keyup', handleKey);
</script>
</body>
</html>
